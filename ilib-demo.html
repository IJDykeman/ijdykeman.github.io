<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <!-- viewport-fit=cover for iPhone notch; lock page zoom so gestures reach the canvas -->
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#3b558d">
  <title>ilib — interactive 3D demo</title>
  <style>
    :root {
      --bg: #2c3656;
      --panel: rgba(18, 24, 43, 0.72);
      --text: #eef2fb;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      /* stop iOS rubber-band scroll / pull-to-refresh stealing touches */
      overscroll-behavior: none;
    }

    /* The wasm app appends its <canvas id="rust_viewer"> here. */
    #wasm-example {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh; /* dynamic viewport height: avoids iOS Safari toolbar gaps */
      background: linear-gradient(160deg, #3b558d 0%, #26304d 100%);
    }

    #rust_viewer {
      width: 100% !important;
      height: 100% !important;
      display: block;
      /* we translate touch -> pointer ourselves; keep the browser from
         scrolling/zooming on top of the canvas */
      touch-action: none;
    }

    #overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      text-align: center;
      padding: 24px;
      background: radial-gradient(120% 120% at 50% 40%, #34406a 0%, #1c2440 100%);
      transition: opacity 0.5s ease;
    }

    #overlay.hidden { opacity: 0; pointer-events: none; }

    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top-color: #7fb2ff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #overlay h1 { font-size: 19px; margin: 0; font-weight: 600; }
    #overlay p { margin: 0; max-width: 320px; opacity: 0.78; font-size: 14px; line-height: 1.5; }
    #overlay .err { color: #ffb4b4; white-space: pre-wrap; font-size: 13px; text-align: left; }
    code { background: rgba(0,0,0,0.25); padding: 1px 5px; border-radius: 5px; }
  </style>
</head>

<body>
  <div id="wasm-example"><!-- WebGL canvas is injected here by the wasm app --></div>

  <div id="overlay">
    <div class="spinner" id="spinner"></div>
    <h1 id="ov-title">Loading the ilib demo…</h1>
    <p id="ov-msg">Compiling a Rust + wgpu 3D scene to your browser (~7&nbsp;MB WebAssembly). First load may take a few seconds.</p>
  </div>

  <script type="module">
    const overlay = document.getElementById('overlay');
    const ovTitle = document.getElementById('ov-title');
    const ovMsg = document.getElementById('ov-msg');
    const spinner = document.getElementById('spinner');

    function fail(title, detail) {
      spinner.style.display = 'none';
      ovTitle.textContent = title;
      ovMsg.innerHTML = '';
      const pre = document.createElement('div');
      pre.className = 'err';
      pre.textContent = String(detail || '');
      ovMsg.appendChild(pre);
      overlay.classList.remove('hidden');
    }

    // --- WebGL availability check (iOS Safari supports WebGL2) ------------------
    try {
      const probe = document.createElement('canvas');
      if (!probe.getContext('webgl2') && !probe.getContext('webgl')) {
        fail('WebGL not available',
          'This device/browser did not expose a WebGL context, which the demo needs to render.');
        throw new Error('no webgl');
      }
    } catch (e) { /* handled above */ }

    // Touch is handled natively inside ilib now (winit WindowEvent::Touch ->
    // one-finger orbit, two-finger pinch-zoom + pan), and egui gets its own
    // touch stream, so the page no longer synthesizes any pointer events.
    // We only suppress the canvas context menu; page-level scroll/zoom is held
    // off by `touch-action: none` and the locked viewport above.

    // Reveal the scene once the wasm app injects its canvas.
    let revealed = false;
    function onCanvasReady(canvas) {
      if (revealed) return;
      revealed = true;
      canvas.addEventListener('contextmenu', (e) => e.preventDefault());
      overlay.classList.add('hidden');
    }

    const existing = document.getElementById('rust_viewer');
    if (existing) {
      onCanvasReady(existing);
    } else {
      const observer = new MutationObserver(() => {
        const c = document.getElementById('rust_viewer');
        if (c) { observer.disconnect(); onCanvasReady(c); }
      });
      observer.observe(document.getElementById('wasm-example'), { childList: true, subtree: true });
    }

    // --- Boot the WebAssembly app ----------------------------------------------
    try {
      const { default: init } = await import('./ilib_demo/ilib_js_app.js');
      await init();
      // Safety net: if the canvas never appears, surface an error.
      setTimeout(() => {
        if (!revealed && !document.getElementById('rust_viewer')) {
          fail('The demo did not start', 'The WebAssembly module loaded but no canvas was rendered.');
        }
      }, 8000);
    } catch (e) {
      console.error(e);
      fail('Could not load the demo', e && e.message ? e.message : e);
    }
  </script>
</body>

</html>
